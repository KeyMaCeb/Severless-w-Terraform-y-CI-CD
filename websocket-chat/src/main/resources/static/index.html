<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat WebSocket</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; background: #eef1f5; margin: 0;
         display: flex; justify-content: center; padding: 24px; }
  .app { width: 100%; max-width: 560px; background: #fff; border-radius: 10px;
         box-shadow: 0 2px 10px rgba(0,0,0,.12); overflow: hidden; }
  header { background: #1f4e79; color: #fff; padding: 14px 18px; display: flex;
           justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  #estado { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: #c0392b; }
  #estado.on { background: #27ae60; }
  .fila { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid #e3e6ea; }
  input { flex: 1; padding: 9px 10px; border: 1px solid #c7ccd3; border-radius: 6px; font-size: 14px; }
  button { padding: 9px 16px; border: 0; border-radius: 6px; background: #1f4e79;
           color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9aa7b4; cursor: not-allowed; }
  #mensajes { height: 340px; overflow-y: auto; padding: 14px 18px; background: #f7f9fb; }
  .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; background: #fff;
         border: 1px solid #e3e6ea; max-width: 85%; word-wrap: break-word; }
  .msg.mio { margin-left: auto; background: #dcecfa; border-color: #bcd6ee; }
  .msg .quien { font-weight: 600; font-size: 13px; color: #1f4e79; }
  .msg .hora { font-size: 11px; color: #7a8591; margin-left: 6px; }
  .msg .texto { margin-top: 2px; font-size: 14px; }
  .sys { text-align: center; font-size: 12px; color: #6b7783; margin: 8px 0; }
  .sys.in { color: #1e8449; }
  .sys.out { color: #b03a2e; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat en tiempo real</h1>
    <span id="estado">Desconectado</span>
  </header>

  <div class="fila">
    <input id="nombre" type="text" placeholder="Tu nombre de usuario" maxlength="20">
    <button id="btnConectar">Conectar</button>
  </div>

  <div id="mensajes"></div>

  <div class="fila">
    <input id="texto" type="text" placeholder="Escribe un mensaje..." disabled>
    <button id="btnEnviar" disabled>Enviar</button>
  </div>
</div>

<script>
  var ws = null;
  var miNombre = "";

  var elNombre = document.getElementById("nombre");
  var elTexto = document.getElementById("texto");
  var elMensajes = document.getElementById("mensajes");
  var elEstado = document.getElementById("estado");
  var btnConectar = document.getElementById("btnConectar");
  var btnEnviar = document.getElementById("btnEnviar");

  function conectar() {
    var nombre = elNombre.value.trim();
    if (!nombre) { elNombre.focus(); return; }

    miNombre = nombre;
    var protocolo = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(protocolo + location.host + "/chat");

    ws.onopen = function () {
      ws.send("JOIN|" + miNombre);
      elEstado.textContent = "Conectado";
      elEstado.className = "on";
      elNombre.disabled = true;
      btnConectar.textContent = "Desconectar";
      elTexto.disabled = false;
      btnEnviar.disabled = false;
      elTexto.focus();
    };

    // El servidor empuja los mensajes: no hay polling ni recarga de página.
    ws.onmessage = function (evento) { mostrar(evento.data); };

    ws.onclose = function () {
      elEstado.textContent = "Desconectado";
      elEstado.className = "";
      elNombre.disabled = false;
      btnConectar.textContent = "Conectar";
      elTexto.disabled = true;
      btnEnviar.disabled = true;
      ws = null;
    };
  }

  function desconectar() { if (ws) ws.close(); }

  function enviar() {
    var t = elTexto.value.trim();
    if (!t || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send("MSG|" + t);
    elTexto.value = "";
    elTexto.focus();
  }

  function mostrar(data) {
    var p = data.split("|");
    var div = document.createElement("div");

    if (p[0] === "SYS") {
      var texto = p.slice(2).join("|");
      div.className = "sys " + (texto.indexOf("se conectó") >= 0 ? "in" : "out");
      div.textContent = "[" + p[1] + "] " + texto;
    } else if (p[0] === "CHAT") {
      var nombre = p[2];
      var contenido = p.slice(3).join("|");
      div.className = "msg" + (nombre === miNombre ? " mio" : "");

      var quien = document.createElement("span");
      quien.className = "quien";
      quien.textContent = nombre;
      var hora = document.createElement("span");
      hora.className = "hora";
      hora.textContent = p[1];
      var cuerpo = document.createElement("div");
      cuerpo.className = "texto";
      cuerpo.textContent = contenido;

      div.appendChild(quien);
      div.appendChild(hora);
      div.appendChild(cuerpo);
    } else {
      return;
    }

    elMensajes.appendChild(div);
    elMensajes.scrollTop = elMensajes.scrollHeight;
  }

  btnConectar.addEventListener("click", function () { ws ? desconectar() : conectar(); });
  btnEnviar.addEventListener("click", enviar);
  elTexto.addEventListener("keydown", function (e) { if (e.key === "Enter") enviar(); });
  elNombre.addEventListener("keydown", function (e) { if (e.key === "Enter" && !ws) conectar(); });
</script>
</body>
</html>
