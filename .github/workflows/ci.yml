name: CI/CD - Backend

on:
  push:
    branches:
      - main
      - feature/aws-lambda
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: api_backend/api_backend
        run: mvn clean package -DskipTests

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: api_backend/api_backend/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: api_backend/api_backend/terraform
        run: terraform validate
