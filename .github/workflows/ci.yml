name: CI/CD - Backend

on:
  push:
    branches:
      - main
      - feature/aws-lambda
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: api_backend/api_backend
        run: mvn clean package -DskipTests

      - name: Verify Lambda JAR
        working-directory: api_backend/api_backend
        run: |
          test -f target/api_backend-0.0.1-SNAPSHOT-shaded.jar
          echo "Lambda JAR encontrado correctamente."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS account and Terraform state
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://api-backend-terraform-state-750390205856/api-backend/

      - name: Terraform Init
        working-directory: api_backend/api_backend/terraform
        run: terraform init

      - name: Verify Terraform state
        working-directory: api_backend/api_backend/terraform
        run: terraform state list

      - name: Terraform Plan
        working-directory: api_backend/api_backend/terraform
        run: terraform plan
